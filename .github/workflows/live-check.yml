name: Live site check

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site URL
        default: https://dream-weaver-gamma-lime.vercel.app
  push:
    branches: [main, live-check]
    paths-ignore: ['**/*.md']

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_URL: ${{ inputs.url || 'https://dream-weaver-gamma-lime.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the Vercel deployment of this commit
        if: github.ref == 'refs/heads/main'
        run: sleep 150
      - name: Install
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check live site
        working-directory: e2e
        run: node live.mjs 2>&1 | tee artifacts-live.log
      - name: Publish report
        if: always()
        run: |
          mkdir -p out && cp -r e2e/artifacts/live/. out/ 2>/dev/null; cp e2e/artifacts-live.log out/ 2>/dev/null
          cd out && git init -q && git checkout -q -b live-report
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "live report ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live-report
